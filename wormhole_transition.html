<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wormhole Transition — Ethan BAI's blog</title>
<style>
:root {
  --bg: #04060c;
  --text: #d4dae4;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',-apple-system,sans-serif;
  overflow-x:hidden; min-height:100vh;
}

/* ─── Demo page layout ─── */
.demo-header {
  position:fixed; top:0; left:0; right:0; z-index:10;
  background:rgba(4,6,12,0.8); backdrop-filter:blur(12px);
  padding:14px 28px; display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid rgba(184,192,212,0.15);
}
.demo-header h1 { font-size:0.9rem; font-weight:400; letter-spacing:0.05em; }
.demo-nav { display:flex; gap:0; }
.demo-nav a {
  color:rgba(212,218,228,0.6); text-decoration:none;
  font-size:0.7rem; font-family:'JetBrains Mono',monospace;
  padding:6px 14px; letter-spacing:0.08em; transition:all 0.3s;
}
.demo-nav a:hover { color:rgba(184,192,212,1); }
.demo-nav a.active { color:rgba(184,192,212,1); }

.demo-pages { padding-top:60px; }

.page-section {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:20px;
}
.page-section h2 { font-size:2rem; font-weight:200; letter-spacing:0.06em; }
.page-section p { color:rgba(212,218,228,0.5); font-size:0.9rem; }
.page-section .wormhole-trigger {
  margin-top:16px; padding:12px 30px;
  background:rgba(128,144,184,0.15); border:1px solid rgba(184,192,212,0.3);
  color:var(--text); font-size:0.74rem; font-weight:500;
  cursor:pointer; font-family:'Outfit',sans-serif;
  letter-spacing:0.08em; text-transform:uppercase;
  transition:all 0.3s;
}
.page-section .wormhole-trigger:hover {
  background:rgba(128,144,184,0.25); border-color:rgba(184,192,212,0.6);
}

/* ==========================================================================
   Wormhole Canvas — full screen
   ========================================================================== */
.wormhole-overlay {
  position:fixed; inset:0; z-index:999;
  pointer-events:none; opacity:0;
  transition:opacity 0.3s ease;
}
.wormhole-overlay.active { opacity:1; pointer-events:all; }
.wormhole-canvas {
  position:absolute; inset:0; width:100%; height:100%;
}

/* ─── Star field ─── */
.star-sphere {
  position:absolute; inset:0; pointer-events:none; z-index:0;
}
.wstar {
  position:absolute; border-radius:50%; background:rgba(200,210,225,0.5);
  animation:wStarPulse linear infinite;
}
@keyframes wStarPulse {
  0%,100% { opacity:0.3; }
  50% { opacity:0.8; }
}

/* ─── Center text overlay ─── */
.wormhole-text {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:2; text-align:center; pointer-events:none;
}
.wormhole-text .w-page {
  font-size:1.2rem; font-family:'JetBrains Mono',monospace;
  letter-spacing:0.2em; color:rgba(212,218,228,0.7);
  opacity:0; transition:opacity 0.5s 0.3s;
}
.wormhole-text .w-label {
  font-size:0.56rem; font-family:'JetBrains Mono',monospace;
  letter-spacing:0.3em; color:rgba(212,218,228,0.3); margin-top:12px;
  opacity:0; transition:opacity 0.5s 0.6s;
}
.wormhole-overlay.active .w-page,
.wormhole-overlay.active .w-label { opacity:1; }

/* ─── Star field for each regular page ─── */
.bg-stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.bstar { position:absolute; border-radius:50%; background:rgba(168,180,196,0.5); animation:bgPulse linear infinite; }
@keyframes bgPulse { 0%,100%{opacity:0.2;} 50%{opacity:0.5;} }

.footer-note {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace; font-size:0.55rem;
  color:rgba(212,218,228,0.25); letter-spacing:0.1em; z-index:1;
}
</style>
</head>
<body>

<!-- Background stars -->
<div class="bg-stars" id="bgStars"></div>

<!-- Demo header -->
<header class="demo-header">
  <h1>Ethan BAI · Wormhole Demo</h1>
  <nav class="demo-nav">
    <a href="#" class="active" data-target="0">Home</a>
    <a href="#" data-target="1">Blog</a>
    <a href="#" data-target="2">About</a>
  </nav>
</header>

<div class="demo-pages">
  <div class="page-section" id="page0">
    <h2>Home · 首页</h2>
    <p>探索深度学习的边界，用代码构建智能的未来。</p>
    <button class="wormhole-trigger" data-to="1">Navigate to Blog →</button>
  </div>
  <div class="page-section" id="page1">
    <h2>Blog · 博客</h2>
    <p>L1W1 神经网络与深度学习笔记 · L1W2 神经网络编程基础</p>
    <button class="wormhole-trigger" data-to="0">Navigate to Home →</button>
  </div>
</div>

<div class="footer-note">WORMHOLE TRANSITION · INTERSTELLAR NAVIGATION</div>

<!-- Wormhole overlay -->
<div class="wormhole-overlay" id="wormhole">
  <canvas class="wormhole-canvas" id="wormCanvas"></canvas>
  <div class="star-sphere" id="wormStars"></div>
  <div class="wormhole-text">
    <div class="w-page" id="wormLabel">IN TRANSIT</div>
    <div class="w-label">WORMHOLE NAVIGATION</div>
  </div>
</div>

<script>
// ===== Background stars =====
(function(){
  const bs=document.getElementById('bgStars');
  for(let i=0;i<180;i++){
    const s=document.createElement('span');s.className='bstar';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    const sz=Math.random()*1.8+0.2;s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.animationDuration=(Math.random()*3+2)+'s';s.style.animationDelay=Math.random()*5+'s';
    bs.appendChild(s);
  }
})();

// ===== Wormhole stars =====
(function(){
  const ws=document.getElementById('wormStars');
  for(let i=0;i<60;i++){
    const s=document.createElement('span');s.className='wstar';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    const sz=Math.random()*2+0.3;s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.animationDuration=(Math.random()*2+1.5)+'s';s.style.animationDelay=Math.random()*3+'s';
    ws.appendChild(s);
  }
})();

// ===== Wormhole Canvas Engine =====
const canvas=document.getElementById('wormCanvas');
const ctx=canvas.getContext('2d');
let w,h,st=Date.now(),wormActive=false;
function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

const wormLayers=[
  {a:0.06,f:0.0015,s:0.04,p:0.0,cl:'rgba(128,144,184,0.08)',lw:0.8},
  {a:0.10,f:0.0022,s:0.055,p:2.0,cl:'rgba(128,144,184,0.06)',lw:1.2},
  {a:0.16,f:0.0030,s:0.07,p:1.2,cl:'rgba(184,192,212,0.05)',lw:1.8},
  {a:0.08,f:0.0018,s:0.048,p:3.0,cl:'rgba(160,144,120,0.04)',lw:1.0},
];

// Wormhole tunnel rings
function drawWormhole(progress){
  const cx=w/2,cy=h/2;
  const maxR=Math.max(w,h)*0.7;
  const tunnelDepth=12;
  const fade=progress>0.8?1-((progress-0.8)/0.2):progress/0.2;

  for(let i=0;i<tunnelDepth;i++){
    const t=i/tunnelDepth;
    const radius=maxR*(1-t*0.9);
    const alpha=(1-t)*0.25*fade;

    ctx.beginPath();
    ctx.ellipse(cx,cy,radius,radius*0.4,0,0,Math.PI*2);
    ctx.strokeStyle=`rgba(184,192,212,${alpha})`;
    ctx.lineWidth=1;
    ctx.stroke();
  }
}

// Radial streaks
function drawStreaks(progress){
  const cx=w/2,cy=h/2;
  const count=40;
  const fade=Math.min(progress*2,1);

  for(let i=0;i<count;i++){
    const angle=(i/count)*Math.PI*2+progress*6;
    const len=(60+Math.sin(i*3.7+progress*4)*40)*fade;
    const x1=cx+Math.cos(angle)*20;
    const y1=cy+Math.sin(angle)*8;
    const x2=cx+Math.cos(angle)*(20+len);
    const y2=cy+Math.sin(angle)*(8+len*0.35);

    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=`rgba(184,192,212,${0.08*fade})`;
    ctx.lineWidth=0.5;ctx.stroke();
  }
}

function animateWormhole(){
  if(!wormActive){requestAnimationFrame(animateWormhole);return;}

  const elapsed=(Date.now()-st)/1000;
  const duration=2.2;
  const progress=Math.min(elapsed/duration,1);

  ctx.clearRect(0,0,w,h);

  // Sine waves during wormhole
  wormLayers.forEach(l=>{
    ctx.beginPath();
    const bY=h*(0.3+l.a*0.8);
    for(let i=0;i<=w;i+=3){
      const ph=i*l.f+l.p+elapsed*l.s*3;
      const y2=bY+Math.sin(ph*Math.PI*2)*h*l.a*(1+elapsed*0.5);
      if(i===0)ctx.moveTo(i,y2);else ctx.lineTo(i,y2);
    }
    ctx.strokeStyle=l.cl;ctx.lineWidth=l.lw*(1+progress);ctx.lineCap='round';ctx.stroke();
  });

  // Draw wormhole tunnel
  if(progress>0.2)drawWormhole(progress);
  if(progress>0.3)drawStreaks(progress);

  if(progress<1){
    requestAnimationFrame(animateWormhole);
  }else{
    wormActive=false;
    document.getElementById('wormhole').classList.remove('active');
    ctx.clearRect(0,0,w,h);
  }
  requestAnimationFrame(animateWormhole);
}
animateWormhole();

// ===== Trigger wormhole =====
let currentPage=0;
document.querySelectorAll('.wormhole-trigger').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const to=parseInt(btn.dataset.to);
    const pageNames=['Home','Blog','About'];
    document.getElementById('wormLabel').textContent='IN TRANSIT · '+pageNames[to].toUpperCase();
    document.getElementById('wormhole').classList.add('active');
    wormActive=true;st=Date.now();
    setTimeout(()=>{
      window.scrollTo({top:to*window.innerHeight,behavior:'smooth'});
      currentPage=to;
      document.querySelectorAll('.demo-nav a').forEach((a,i)=>{
        a.classList.toggle('active',i===to);
      });
    },2200);
  });
});

document.querySelectorAll('.demo-nav a').forEach(link=>{
  link.addEventListener('click',e=>{
    e.preventDefault();
    const to=parseInt(link.dataset.target);
    if(to===currentPage)return;
    const pageNames=['Home','Blog','About'];
    document.getElementById('wormLabel').textContent='IN TRANSIT · '+pageNames[to].toUpperCase();
    document.getElementById('wormhole').classList.add('active');
    wormActive=true;st=Date.now();
    setTimeout(()=>{
      window.scrollTo({top:to*window.innerHeight,behavior:'smooth'});
      currentPage=to;
      document.querySelectorAll('.demo-nav a').forEach((a,i)=>{
        a.classList.toggle('active',i===to);
      });
    },2200);
  });
});
</script>
</body>
</html>
