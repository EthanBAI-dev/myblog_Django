{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bai's Space{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdn.bootcdn.net/ajax/libs/github-markdown-css/5.2.0/github-markdown-light.min.css">

    <link rel="stylesheet"
          href="{% static 'blog/css/style.css' %}?v=20260422">

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const tocLinks = document.querySelectorAll('.toc-body a[href^="#"]');

        tocLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();

                const hash = this.getAttribute('href');
                const target = document.querySelector(hash);

                if (!target) return;

                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            });
        });
    });
    </script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="{% url 'blog:post_list' %}" class="brand">Bai's Space</a>

            <nav class="nav-links">
                <a href="{% url 'blog:post_list' %}">文章</a>
                <a href="/admin/">后台</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <p>Built with Django · Markdown · Notes by Bai</p>
        </div>
    </footer>
</body>
</html>
