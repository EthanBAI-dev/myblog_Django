{% extends 'users/base.html' %}

{% block title %}重置密码 - 博客{% endblock title %}

{% block content %}
<div class="bg-white rounded-lg shadow-md p-8">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">重置密码</h1>
    <p class="text-center text-gray-500 text-sm mb-6">请输入你的新密码</p>
    <hr class="mb-6">

    <form action="" method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded transition">
            确 认 修 改
        </button>
    </form>
</div>
{% endblock content %}
