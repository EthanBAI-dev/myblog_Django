{% extends 'users/base.html' %}

{% block title %}忘记密码 - 博客{% endblock title %}

{% block content %}
<div class="bg-white rounded-lg shadow-md p-8">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">找回密码</h1>
    <p class="text-center text-gray-500 text-sm mb-6">输入注册邮箱，我们将发送重置链接</p>
    <hr class="mb-6">

    <form action="" method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded transition">
            发送重置链接
        </button>

        <div class="text-sm text-center">
            <a href="{% url 'users:login' %}" class="text-blue-500 hover:text-blue-700">返回登录</a>
        </div>
    </form>
</div>
{% endblock content %}
