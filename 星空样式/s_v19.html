<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Nebula Generator — Ethan BAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #03050a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    canvas { display: block; }

    /* ─── Control Panel ─── */
    #ctrl-panel {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 100;
      width: 300px;
      max-height: calc(100vh - 32px);
      background: rgba(6, 8, 16, 0.88);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      font-size: 11px;
      color: #c8d0dc;
      display: flex;
      flex-direction: column;
      user-select: none;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      transition: opacity 0.3s, transform 0.3s;
    }
    #ctrl-panel.collapsed .ctrl-body { display: none; }
    #ctrl-panel.collapsed { width: auto; min-width: 0; }

    .ctrl-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; cursor: grab;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .ctrl-header:active { cursor: grabbing; }
    .ctrl-title {
      font-weight: 700; font-size: 13px; letter-spacing: 0.06em;
      color: #e0e6f0;
      text-shadow: 0 0 12px rgba(188,200,220,0.15);
    }
    .ctrl-btns { display: flex; gap: 6px; }
    .ctrl-btns button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      color: #aab5c5;
      border-radius: 6px; cursor: pointer;
      font-size: 12px; line-height: 1; padding: 3px 8px 4px;
      transition: all 0.15s;
    }
    .ctrl-btns button:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .ctrl-body {
      overflow-y: auto; padding: 8px 12px 12px; flex: 1;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .ctrl-body::-webkit-scrollbar { width: 4px; }
    .ctrl-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 4px; }

    .ctrl-section {
      margin-bottom: 10px;
    }
    .ctrl-section-label {
      font-size: 10px; font-weight: 600;
      color: #7a8aa0; letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 2px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .ctrl-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 2px; gap: 6px;
    }
    .ctrl-row label {
      flex: 0 0 auto; white-space: nowrap;
      font-size: 10px; color: #8a9ab0;
      min-width: 64px;
    }
    .ctrl-row input[type=range] {
      flex: 1; height: 3px; min-width: 0;
      -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.10);
      border-radius: 2px; outline: none;
    }
    .ctrl-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px; border-radius: 50%;
      background: #b8c8e0; border: none; cursor: pointer;
      box-shadow: 0 0 8px rgba(184,200,224,0.25);
    }
    .ctrl-row input[type=range]::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: #b8c8e0; border: none; cursor: pointer;
    }
    .ctrl-val {
      flex: 0 0 48px; text-align: right;
      font-size: 10px; color: #b8c8e0;
      font-weight: 500; white-space: nowrap;
    }

    /* ─── Preset Buttons ─── */
    .preset-row {
      display: flex; gap: 5px; flex-wrap: wrap;
      padding: 4px 2px;
    }
    .preset-btn {
      flex: 1; min-width: 56px;
      padding: 4px 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #8a9ab0; font-size: 10px;
      cursor: pointer; text-align: center;
      transition: all 0.2s;
      font-family: inherit;
    }
    .preset-btn:hover {
      background: rgba(255,255,255,0.10);
      color: #e0e6f0;
      border-color: rgba(255,255,255,0.16);
    }
    .preset-btn.active {
      background: rgba(184,200,224,0.12);
      color: #e0e6f0;
      border-color: rgba(184,200,224,0.25);
    }

    @media (max-width: 640px) {
      #ctrl-panel { width: 240px; left: 8px; top: 8px; font-size: 10px; }
      .ctrl-row label { min-width: 48px; font-size: 9px; }
      .ctrl-val { flex: 0 0 36px; font-size: 9px; }
    }
  </style>
</head>
<body>

<div id="ctrl-panel">
  <div class="ctrl-header">
    <span class="ctrl-title">✦ 星云生成器</span>
    <div class="ctrl-btns">
      <button id="ctrl-toggle" title="收起/展开">─</button>
    </div>
  </div>
  <div class="ctrl-body">

    <!-- Presets -->
    <div class="ctrl-section">
      <div class="ctrl-section-label">预设</div>
      <div class="preset-row" id="preset-row">
        <button class="preset-btn" data-preset="orion">猎户座</button>
        <button class="preset-btn" data-preset="spiral">螺旋星系</button>
        <button class="preset-btn" data-preset="fluid">宇宙流体</button>
        <button class="preset-btn" data-preset="aurora">极光星尘</button>
      </div>
    </div>

    <!-- Technique Weights -->
    <div class="ctrl-section">
      <div class="ctrl-section-label">方法混合权重</div>
      <div class="ctrl-row">
        <label>粒子系统</label>
        <input type="range" min="0" max="1" step="0.01" value="1.0" id="w-particles" />
        <span class="ctrl-val" id="v-particles">1.00</span>
      </div>
      <div class="ctrl-row">
        <label>公告板纹理</label>
        <input type="range" min="0" max="1" step="0.01" value="0.85" id="w-billboards" />
        <span class="ctrl-val" id="v-billboards">0.85</span>
      </div>
      <div class="ctrl-row">
        <label>噪声 Shader</label>
        <input type="range" min="0" max="1" step="0.01" value="0.45" id="w-noise" />
        <span class="ctrl-val" id="v-noise">0.45</span>
      </div>
    </div>

    <!-- Particle Params -->
    <div class="ctrl-section">
      <div class="ctrl-section-label">粒子系统</div>
      <div class="ctrl-row">
        <label>粒子数量</label>
        <input type="range" min="1000" max="100000" step="500" value="50000" id="p-count" />
        <span class="ctrl-val" id="v-p-count">50000</span>
      </div>
      <div class="ctrl-row">
        <label>粒子大小</label>
        <input type="range" min="0.1" max="5.0" step="0.05" value="0.35" id="p-size" />
        <span class="ctrl-val" id="v-p-size">0.35</span>
      </div>
    </div>

    <!-- Billboard Params -->
    <div class="ctrl-section">
      <div class="ctrl-section-label">公告板纹理</div>
      <div class="ctrl-row">
        <label>纹理数量</label>
        <input type="range" min="5" max="200" step="1" value="50" id="b-count" />
        <span class="ctrl-val" id="v-b-count">50</span>
      </div>
      <div class="ctrl-row">
        <label>大小范围</label>
        <input type="range" min="2" max="30" step="0.5" value="8" id="b-size" />
        <span class="ctrl-val" id="v-b-size">8.0</span>
      </div>
    </div>

    <!-- Noise Shader Params -->
    <div class="ctrl-section">
      <div class="ctrl-section-label">噪声 Shader</div>
      <div class="ctrl-row">
        <label>流动速度</label>
        <input type="range" min="0" max="3.0" step="0.05" value="1.0" id="n-speed" />
        <span class="ctrl-val" id="v-n-speed">1.00</span>
      </div>
      <div class="ctrl-row">
        <label>噪声缩放</label>
        <input type="range" min="0.5" max="8.0" step="0.1" value="2.5" id="n-scale" />
        <span class="ctrl-val" id="v-n-scale">2.5</span>
      </div>
    </div>

    <!-- Bloom PostFX -->
    <div class="ctrl-section">
      <div class="ctrl-section-label">后期 Bloom</div>
      <div class="ctrl-row">
        <label>强度</label>
        <input type="range" min="0" max="3.0" step="0.01" value="1.45" id="bloom-int" />
        <span class="ctrl-val" id="v-bloom-int">1.45</span>
      </div>
      <div class="ctrl-row">
        <label>阈值</label>
        <input type="range" min="0" max="1.0" step="0.01" value="0.0" id="bloom-thr" />
        <span class="ctrl-val" id="v-bloom-thr">0.00</span>
      </div>
      <div class="ctrl-row">
        <label>半径</label>
        <input type="range" min="0.1" max="2.0" step="0.01" value="0.8" id="bloom-rad" />
        <span class="ctrl-val" id="v-bloom-rad">0.80</span>
      </div>
    </div>

  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const STATE = {
  // Weights
  wParticles: 1.0,
  wBillboards: 0.85,
  wNoise: 0.45,
  // Particles
  pCount: 50000,
  pSize: 0.35,
  // Billboards
  bCount: 50,
  bSize: 8,
  // Noise Shader
  nSpeed: 1.0,
  nScale: 2.5,
  // Bloom
  bloomInt: 1.45,
  bloomThr: 0.0,
  bloomRad: 0.8,
  // Preset
  activePreset: null
};

const COLORS = {
  warm: new THREE.Color('#ff8800'),
  mid: new THREE.Color('#8a7dff'),
  cool: new THREE.Color('#4422ff')
};

// ═══════════════════════════════════════════════════
// RENDERER / SCENE / CAMERA
// ═══════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03050a, 0.008);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(15, 20, 25);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 1.0;
controls.minDistance = 5;
controls.maxDistance = 80;
controls.target.set(0, 0, 0);

// ═══════════════════════════════════════════════════
// COMPOSER
// ═══════════════════════════════════════════════════
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  STATE.bloomInt, STATE.bloomRad, STATE.bloomThr
);
composer.addPass(bloomPass);

// ═══════════════════════════════════════════════════
// SHARED SMOKE TEXTURE
// ═══════════════════════════════════════════════════
function createSmokeTexture(size = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createRadialGradient(size/2, size/2, size*0.05, size/2, size/2, size*0.5);
  grad.addColorStop(0.0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.2, 'rgba(255,255,255,0.7)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.2)');
  grad.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // Noise speckles
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = size * (0.03 + Math.random() * 0.10);
    const g2 = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.01 + Math.random() * 0.03;
    g2.addColorStop(0, `rgba(255,255,255,${a})`);
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}
const smokeTexture = createSmokeTexture(256);

// ═══════════════════════════════════════════════════
// COLOR HELPER
// ═══════════════════════════════════════════════════
function lerpColor(t) {
  // t: 0=warm, 0.5=mid, 1=cool
  if (t < 0.5) {
    return COLORS.warm.clone().lerp(COLORS.mid, t * 2);
  }
  return COLORS.mid.clone().lerp(COLORS.cool, (t - 0.5) * 2);
}

function rand(min, max) { return min + Math.random() * (max - min); }

// ═══════════════════════════════════════════════════
// NEBULA GROUP
// ═══════════════════════════════════════════════════
const nebula = new THREE.Group();
scene.add(nebula);

let particles = null;    // Points
let billboards = [];     // Sprite[]
let noiseSphere = null;  // Mesh with ShaderMaterial

// ═══════════════════════════════════════════════════
// A) PARTICLE SYSTEM
// ═══════════════════════════════════════════════════
function buildParticles() {
  if (particles) {
    nebula.remove(particles);
    particles.geometry.dispose();
    particles.material.dispose();
    particles = null;
  }
  const count = STATE.pCount;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    // Flattened oblate spheroid with spiral bias
    const r = 6 + Math.pow(Math.random(), 0.6) * 20;
    const theta = Math.random() * Math.PI * 2 + r * 0.15; // spiral twist
    const phi = Math.acos(2 * Math.random() - 1);
    const flatten = 0.35 + 0.65 * (1 - r / 26);

    positions[i3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i3 + 1] = r * Math.cos(phi) * flatten * 0.5;
    positions[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const t = r / 26;
    const col = lerpColor(t);
    colors[i3] = col.r;
    colors[i3 + 1] = col.g;
    colors[i3 + 2] = col.b;
    sizes[i] = STATE.pSize * (0.5 + Math.random() * 1.0);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true,
    uniforms: { uOpacity: { value: STATE.wParticles } },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      uniform float uOpacity;
      void main() {
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (120.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      uniform float uOpacity;
      void main() {
        vec2 p = gl_PointCoord - 0.5;
        float d = length(p);
        float a = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor, a * uOpacity);
      }
    `
  });

  particles = new THREE.Points(geo, mat);
  particles.renderOrder = 0;
  nebula.add(particles);
}

// ═══════════════════════════════════════════════════
// B) BILLBOARD SPRITES
// ═══════════════════════════════════════════════════
function buildBillboards() {
  // Remove old
  for (const s of billboards) {
    nebula.remove(s);
    s.material.dispose();
    if (s.material.map) s.material.map.dispose();
  }
  billboards = [];

  const count = STATE.bCount;
  const baseSize = STATE.bSize;

  for (let i = 0; i < count; i++) {
    const t = Math.random();
    const color = lerpColor(t * 0.7); // 0→warm, 0.7→mid-ish
    const opacity = 0.05 + Math.random() * 0.12;

    const mat = new THREE.SpriteMaterial({
      map: smokeTexture,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      color: color,
      opacity: opacity * STATE.wBillboards
    });

    const sprite = new THREE.Sprite(mat);

    // Position: oblate spheroid, larger radius than particles
    const r = 4 + Math.pow(Math.random(), 0.5) * 16;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const flatten = 0.25 + 0.75 * (1 - r / 20);

    sprite.position.set(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi) * flatten * 0.4,
      r * Math.sin(phi) * Math.sin(theta)
    );

    const s = baseSize * (0.5 + Math.random() * 1.5);
    sprite.scale.set(s, s * (0.7 + Math.random() * 0.6), 1);
    sprite.material.rotation = rand(0, Math.PI * 2);

    sprite.userData = {
      baseOpacity: opacity,
      seed: Math.random() * 1000
    };

    sprite.renderOrder = 1;
    nebula.add(sprite);
    billboards.push(sprite);
  }
}

// ═══════════════════════════════════════════════════
// C) NOISE SHADER — ICOSAHEDRON SPHERE
// ═══════════════════════════════════════════════════
const noiseUniforms = {
  uTime: { value: 0 },
  uSpeed: { value: STATE.nSpeed },
  uScale: { value: STATE.nScale },
  uOpacity: { value: STATE.wNoise }
};

function buildNoiseSphere() {
  if (noiseSphere) {
    nebula.remove(noiseSphere);
    noiseSphere.geometry.dispose();
    noiseSphere.material.dispose();
    noiseSphere = null;
  }

  const geo = new THREE.IcosahedronGeometry(12, 64);

  // Optimize: use a reasonable subdivision
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    uniforms: noiseUniforms,
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uSpeed;
      uniform float uScale;
      uniform float uOpacity;

      varying vec3 vWorldPos;

      // Simple GLSL noise
      float hash(vec3 p) {
        p = fract(p * 0.3183099 + 0.1);
        p *= 17.0;
        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
      }

      float noise(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);

        float a = hash(i);
        float b = hash(i + vec3(1.0, 0.0, 0.0));
        float c = hash(i + vec3(0.0, 1.0, 0.0));
        float d = hash(i + vec3(1.0, 1.0, 0.0));
        float e = hash(i + vec3(0.0, 0.0, 1.0));
        float f_ = hash(i + vec3(1.0, 0.0, 1.0));
        float g = hash(i + vec3(0.0, 1.0, 1.0));
        float h = hash(i + vec3(1.0, 1.0, 1.0));

        float u1 = mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        float u2 = mix(mix(e, f_, f.x), mix(g, h, f.x), f.y);
        return mix(u1, u2, f.z);
      }

      float fbm(vec3 p) {
        float value = 0.0;
        float amplitude = 0.5;
        float frequency = 1.0;
        for (int i = 0; i < 4; i++) {
          value += amplitude * noise(p * frequency);
          frequency *= 2.0;
          amplitude *= 0.5;
        }
        return value;
      }

      void main() {
        vec3 p = vWorldPos * uScale + uTime * uSpeed * 0.3;
        float n = fbm(p);

        // Flow effect
        float flow = sin(uTime * 0.2 + n * 6.0) * 0.5 + 0.5;

        // Color: cool base with warm glow where noise is high
        vec3 warmCol = vec3(1.0, 0.53, 0.0);   // #ff8800
        vec3 coolCol = vec3(0.27, 0.13, 1.0);   // #4422ff
        vec3 midCol = vec3(0.54, 0.49, 1.0);    // #8a7dff

        vec3 col1 = mix(coolCol, midCol, n);
        vec3 col2 = mix(midCol, warmCol, flow * n);
        vec3 finalCol = mix(col1, col2, 0.3 + 0.7 * n);

        // Alpha: center bright, edges dim, flowing
        float distCenter = length(vWorldPos) / 12.0;
        float edgeFade = 1.0 - smoothstep(0.3, 1.0, distCenter);
        float alpha = n * 0.6 + flow * 0.2 + 0.1;
        alpha *= edgeFade;
        alpha *= uOpacity;

        gl_FragColor = vec4(finalCol, alpha);
      }
    `
  });

  noiseSphere = new THREE.Mesh(geo, mat);
  noiseSphere.renderOrder = 2;
  nebula.add(noiseSphere);
}

// ═══════════════════════════════════════════════════
// REBUILD ALL
// ═══════════════════════════════════════════════════
function rebuild() {
  buildParticles();
  buildBillboards();
  buildNoiseSphere();
}

// ═══════════════════════════════════════════════════
// PRESETS
// ═══════════════════════════════════════════════════
function applyPreset(name) {
  // Update STATE
  const presets = {
    orion: {
      wParticles: 0.65, wBillboards: 1.0, wNoise: 0.2,
      pCount: 60000, pSize: 0.5,
      bCount: 80, bSize: 10,
      nSpeed: 0.6, nScale: 2.0,
      bloomInt: 1.6, bloomThr: 0.0, bloomRad: 0.9
    },
    spiral: {
      wParticles: 1.0, wBillboards: 0.3, wNoise: 0.15,
      pCount: 80000, pSize: 0.25,
      bCount: 25, bSize: 5,
      nSpeed: 0.3, nScale: 3.5,
      bloomInt: 0.8, bloomThr: 0.0, bloomRad: 0.5
    },
    fluid: {
      wParticles: 0.2, wBillboards: 0.4, wNoise: 1.0,
      pCount: 15000, pSize: 0.3,
      bCount: 40, bSize: 7,
      nSpeed: 2.5, nScale: 1.5,
      bloomInt: 2.2, bloomThr: 0.0, bloomRad: 1.2
    },
    aurora: {
      wParticles: 0.8, wBillboards: 0.7, wNoise: 0.6,
      pCount: 50000, pSize: 0.4,
      bCount: 60, bSize: 12,
      nSpeed: 1.8, nScale: 2.0,
      bloomInt: 1.8, bloomThr: 0.0, bloomRad: 1.0
    }
  };

  const p = presets[name];
  if (!p) return;
  Object.assign(STATE, p);
  STATE.activePreset = name;

  // Update slider UI
  syncSliders();

  // Update bloom
  bloomPass.strength = STATE.bloomInt;
  bloomPass.threshold = STATE.bloomThr;
  bloomPass.radius = STATE.bloomRad;

  // Rebuild
  rebuild();

  // Update preset button active state
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.preset === name);
  });
}

function syncSliders() {
  const map = {
    'w-particles': 'wParticles', 'w-billboards': 'wBillboards', 'w-noise': 'wNoise',
    'p-count': 'pCount', 'p-size': 'pSize',
    'b-count': 'bCount', 'b-size': 'bSize',
    'n-speed': 'nSpeed', 'n-scale': 'nScale',
    'bloom-int': 'bloomInt', 'bloom-thr': 'bloomThr', 'bloom-rad': 'bloomRad'
  };
  for (const [id, key] of Object.entries(map)) {
    const el = document.getElementById(id);
    const valEl = document.getElementById('v-' + id);
    if (el) el.value = STATE[key];
    if (valEl) valEl.textContent = formatVal(STATE[key], key);
  }
}

function formatVal(v, key) {
  if (key === 'pCount' || key === 'bCount') return String(Math.round(v));
  if (key === 'bloomThr' || key === 'bloomRad') return v.toFixed(2);
  if (key === 'pSize' || key === 'bSize' || key === 'nScale') return v.toFixed(1);
  return v.toFixed(2);
}

// ═══════════════════════════════════════════════════
// UI BINDINGS
// ═══════════════════════════════════════════════════
function setupUI() {
  // Slider bindings
  const sliders = [
    { id: 'w-particles', key: 'wParticles', rebuild: false, bloom: false },
    { id: 'w-billboards', key: 'wBillboards', rebuild: false, bloom: false },
    { id: 'w-noise', key: 'wNoise', rebuild: false, bloom: false },
    { id: 'p-count', key: 'pCount', rebuild: true, bloom: false },
    { id: 'p-size', key: 'pSize', rebuild: true, bloom: false },
    { id: 'b-count', key: 'bCount', rebuild: true, bloom: false },
    { id: 'b-size', key: 'bSize', rebuild: true, bloom: false },
    { id: 'n-speed', key: 'nSpeed', rebuild: false, bloom: false },
    { id: 'n-scale', key: 'nScale', rebuild: true, bloom: false },
    { id: 'bloom-int', key: 'bloomInt', rebuild: false, bloom: true },
    { id: 'bloom-thr', key: 'bloomThr', rebuild: false, bloom: true },
    { id: 'bloom-rad', key: 'bloomRad', rebuild: false, bloom: true }
  ];

  for (const s of sliders) {
    const input = document.getElementById(s.id);
    const valEl = document.getElementById('v-' + s.id);
    if (!input) continue;

    // Initial value
    input.value = STATE[s.key];

    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      STATE[s.key] = v;
      if (valEl) valEl.textContent = formatVal(v, s.key);
      STATE.activePreset = null;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));

      if (s.bloom) {
        bloomPass.strength = STATE.bloomInt;
        bloomPass.threshold = STATE.bloomThr;
        bloomPass.radius = STATE.bloomRad;
      }

      if (s.rebuild) {
        rebuild();
      } else if (!s.bloom) {
        // Update uniforms in-place
        if (particles && s.key === 'wParticles') {
          particles.material.uniforms.uOpacity.value = v;
        }
        if (noiseSphere && s.key === 'wNoise') {
          noiseSphere.material.uniforms.uOpacity.value = v;
        }
        if (s.key === 'nSpeed') {
          noiseUniforms.uSpeed.value = v;
        }
        // Billboard opacity: update all
        if (s.key === 'wBillboards') {
          for (const sp of billboards) {
            sp.material.opacity = sp.userData.baseOpacity * v;
          }
        }
      }
    });
  }

  // Preset buttons
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      applyPreset(btn.dataset.preset);
    });
  });

  // Toggle panel
  document.getElementById('ctrl-toggle').addEventListener('click', () => {
    const panel = document.getElementById('ctrl-panel');
    panel.classList.toggle('collapsed');
    document.getElementById('ctrl-toggle').textContent =
      panel.classList.contains('collapsed') ? '+' : '─';
  });

  // Drag panel
  const panel = document.getElementById('ctrl-panel');
  const header = panel.querySelector('.ctrl-header');
  let dragging = false, ox = 0, oy = 0;
  header.addEventListener('mousedown', (e) => {
    dragging = true;
    const r = panel.getBoundingClientRect();
    ox = e.clientX - r.left;
    oy = e.clientY - r.top;
    panel.style.cursor = 'grabbing';
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    panel.style.left = (e.clientX - ox) + 'px';
    panel.style.top = (e.clientY - oy) + 'px';
    panel.style.right = 'auto';
  });
  document.addEventListener('mouseup', () => {
    dragging = false;
    panel.style.cursor = '';
  });
}

// ═══════════════════════════════════════════════════
// ANIMATION
// ═══════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const delta = Math.min(clock.getDelta(), 0.05);

  // Rotate nebula group slowly
  nebula.rotation.y += 0.0003 * delta * 60;
  nebula.rotation.x = Math.sin(t * 0.04) * 0.04;
  nebula.rotation.z = Math.cos(t * 0.03) * 0.03;

  // Billboard sprites face camera (Sprites always do inherently in Three.js!)
  // Add subtle drifting motion
  for (const sp of billboards) {
    const d = sp.userData;
    sp.position.x += Math.sin(t * 0.12 + d.seed) * 0.002;
    sp.position.y += Math.cos(t * 0.10 + d.seed * 1.3) * 0.002;
    sp.position.z += Math.sin(t * 0.08 + d.seed * 0.7) * 0.002;

    // Pulse scale
    const pulse = 1 + Math.sin(t * 0.3 + d.seed * 2) * 0.04;
    sp.scale.x = sp.userData._baseSX !== undefined ? sp.userData._baseSX * pulse : sp.scale.x;
    sp.scale.y = sp.userData._baseSY !== undefined ? sp.userData._baseSY * pulse : sp.scale.y;
  }

  // Store base scale on billboard creation
  // (patch after build)
  if (billboards.length > 0 && billboards[0].userData._baseSX === undefined) {
    for (const sp of billboards) {
      sp.userData._baseSX = sp.scale.x;
      sp.userData._baseSY = sp.scale.y;
    }
  }

  // Update noise shader time
  noiseUniforms.uTime.value = t * STATE.nSpeed;

  controls.update();
  composer.render();
}

// ═══════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
setupUI();
rebuild();

// Apply default preset (Orion)
applyPreset('orion');

// Start animation
animate();
</script>
</body>
