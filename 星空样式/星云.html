<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nebula Route A - Billboard Volumetric</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #09111f 0%, #03060d 55%, #000 100%);
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.035);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.1, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

/* -----------------------------
   背景星星
----------------------------- */
function createStars(count = 2200) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    const r = 24 + Math.random() * 20;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);

    positions[i3 + 0] = r * Math.sin(phi) * Math.cos(theta);
    positions[i3 + 1] = r * Math.cos(phi);
    positions[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    sizes[i] = 0.4 + Math.random() * 1.5;
  }

  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float aSize;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (120.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      void main() {
        vec2 p = gl_PointCoord - 0.5;
        float d = length(p);
        float a = smoothstep(0.5, 0.0, d) * 0.7;
        gl_FragColor = vec4(vec3(1.0), a);
      }
    `
  });

  const stars = new THREE.Points(geo, mat);
  scene.add(stars);
}
createStars();

/* -----------------------------
   Instanced billboard quads
----------------------------- */
const quadBase = new THREE.PlaneGeometry(1, 1, 1, 1);
const geo = new THREE.InstancedBufferGeometry();

geo.index = quadBase.index;
geo.setAttribute("position", quadBase.attributes.position);
geo.setAttribute("uv", quadBase.attributes.uv);

const count = 1200;
const offsets = new Float32Array(count * 3);
const sizes = new Float32Array(count);
const colors = new Float32Array(count * 3);
const seeds = new Float32Array(count);

function randn() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

const blobs = [
  {
    center: new THREE.Vector3(-2.2,  0.8,  0.0),
    radius: new THREE.Vector3(2.3, 1.1, 1.3),
    a: new THREE.Color("#46b5ff"),
    b: new THREE.Color("#775cff")
  },
  {
    center: new THREE.Vector3( 1.6, -0.4, -0.3),
    radius: new THREE.Vector3(2.1, 1.0, 1.5),
    a: new THREE.Color("#9f63ff"),
    b: new THREE.Color("#ff5ca8")
  },
  {
    center: new THREE.Vector3( 0.0,  1.3, -0.8),
    radius: new THREE.Vector3(1.6, 0.8, 1.2),
    a: new THREE.Color("#65dfc9"),
    b: new THREE.Color("#7b6cff")
  },
  {
    center: new THREE.Vector3(-0.1, -1.2,  0.7),
    radius: new THREE.Vector3(1.8, 0.9, 1.3),
    a: new THREE.Color("#4fb8ff"),
    b: new THREE.Color("#de4b93")
  }
];

for (let i = 0; i < count; i++) {
  const i3 = i * 3;
  const blob = blobs[(Math.random() * blobs.length) | 0];

  offsets[i3 + 0] = blob.center.x + randn() * blob.radius.x;
  offsets[i3 + 1] = blob.center.y + randn() * blob.radius.y;
  offsets[i3 + 2] = blob.center.z + randn() * blob.radius.z;

  sizes[i] = 0.9 + Math.random() * 2.6;
  seeds[i] = Math.random() * 1000;

  const c = blob.a.clone().lerp(blob.b, Math.random());

  // 保颜色，不搞大白核
  c.multiplyScalar(0.55 + Math.random() * 0.35);

  colors[i3 + 0] = c.r;
  colors[i3 + 1] = c.g;
  colors[i3 + 2] = c.b;
}

geo.setAttribute("instanceOffset", new THREE.InstancedBufferAttribute(offsets, 3));
geo.setAttribute("instanceScale", new THREE.InstancedBufferAttribute(sizes, 1));
geo.setAttribute("instanceColor", new THREE.InstancedBufferAttribute(colors, 3));
geo.setAttribute("instanceSeed", new THREE.InstancedBufferAttribute(seeds, 1));
geo.instanceCount = count;

/* -----------------------------
   Shader
----------------------------- */
const mat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,

  // 关键：这里不用 Additive，避免中心直接烧白
  blending: THREE.NormalBlending,

  uniforms: {
    uTime: { value: 0.0 }
  },

  vertexShader: `
    uniform float uTime;

    attribute vec3 instanceOffset;
    attribute float instanceScale;
    attribute vec3 instanceColor;
    attribute float instanceSeed;

    varying vec2 vUv;
    varying vec3 vColor;
    varying float vSeed;
    varying float vDepth;

    void main() {
      vUv = uv;
      vColor = instanceColor;
      vSeed = instanceSeed;

      vec3 center = instanceOffset;

      // 轻微漂移
      float t = uTime * 0.08;
      center.x += sin(t + instanceSeed * 2.3) * 0.12;
      center.y += cos(t * 1.2 + instanceSeed * 1.7) * 0.10;
      center.z += sin(t * 0.8 + instanceSeed * 3.8) * 0.08;

      // 先算云片中心的 view-space
      vec4 mv = modelViewMatrix * vec4(center, 1.0);

      // billboard: 直接在 view space 里展开 quad
      float scale = instanceScale * (0.95 + 0.12 * sin(uTime * 0.35 + instanceSeed * 6.2831));
      mv.xy += position.xy * scale;

      gl_Position = projectionMatrix * mv;

      vDepth = clamp((-mv.z - 2.0) / 18.0, 0.0, 1.0);
    }
  `,

  fragmentShader: `
    varying vec2 vUv;
    varying vec3 vColor;
    varying float vSeed;
    varying float vDepth;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 345.45));
      p += dot(p, p + 34.345);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);

      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));

      vec2 u = f * f * (3.0 - 2.0 * f);

      return mix(a, b, u.x) +
             (c - a) * u.y * (1.0 - u.x) +
             (d - b) * u.x * u.y;
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++) {
        v += noise(p) * a;
        p *= 2.0;
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec2 uv = vUv;
      vec2 p = uv - 0.5;

      // 做一点不规则拉伸，避免“完美圆饼”
      p.x *= 1.35;
      p.y *= 0.88;

      float d = length(p);

      // 大体轮廓
      float radial = smoothstep(0.68, 0.06, d);

      // 内部云纹理
      float n1 = fbm(uv * 3.5 + vSeed * 0.031);
      float n2 = fbm(uv * 7.0 + vec2(4.2, 1.7) + vSeed * 0.017);
      float n3 = fbm((uv * vec2(5.0, 2.6)) + vec2(1.8, 5.7) + vSeed * 0.011);

      float wispy = mix(n1, n2, 0.55);
      wispy *= mix(0.7, 1.15, n3);

      // 边缘破碎
      float edgeBreak = smoothstep(0.2, 0.85, wispy);

      // 关键：压低中心，避免一整块发白
      float centerTame = 0.78 + 0.22 * smoothstep(0.00, 0.16, d);

      float alpha = radial * edgeBreak * centerTame;

      // 进一步减 alpha，颜色交给层次，不靠爆亮
      alpha *= 0.34;

      // 远处更淡
      alpha *= mix(1.0, 0.55, vDepth);

      if (alpha < 0.02) discard;

      vec3 color = vColor;

      // 轻微局部色彩扰动，不强行加白高光
      color *= mix(0.85, 1.15, n1);
      color += vec3(0.02, 0.01, 0.03) * (1.0 - d);

      gl_FragColor = vec4(color, alpha);
    }
  `
});

const cloud = new THREE.Mesh(geo, mat);
scene.add(cloud);

/* -----------------------------
   再补一层大薄雾
----------------------------- */
const geo2 = geo.clone();
const offsets2 = geo2.getAttribute("instanceOffset");
const sizes2 = new Float32Array(count);
const colors2 = new Float32Array(count * 3);
const seeds2 = new Float32Array(count);

for (let i = 0; i < count; i++) {
  sizes2[i] = 1.8 + Math.random() * 3.8;
  seeds2[i] = Math.random() * 1000;

  const c = new THREE.Color(
    colors[(i * 3) + 0],
    colors[(i * 3) + 1],
    colors[(i * 3) + 2]
  ).multiplyScalar(0.55);

  colors2[i * 3 + 0] = c.r;
  colors2[i * 3 + 1] = c.g;
  colors2[i * 3 + 2] = c.b;
}

geo2.setAttribute("instanceScale", new THREE.InstancedBufferAttribute(sizes2, 1));
geo2.setAttribute("instanceColor", new THREE.InstancedBufferAttribute(colors2, 3));
geo2.setAttribute("instanceSeed", new THREE.InstancedBufferAttribute(seeds2, 1));

const mat2 = mat.clone();
mat2.uniforms = THREE.UniformsUtils.clone(mat.uniforms);

const cloud2 = new THREE.Mesh(geo2, mat2);
cloud2.rotation.z = 0.2;
scene.add(cloud2);

/* -----------------------------
   动画
----------------------------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  mat.uniforms.uTime.value = t;
  mat2.uniforms.uTime.value = t * 0.9;

  cloud.rotation.z += 0.00035;
  cloud.rotation.y = Math.sin(t * 0.08) * 0.12;

  cloud2.rotation.z -= 0.00018;
  cloud2.rotation.y = Math.cos(t * 0.06) * 0.10;

  camera.position.x = Math.sin(t * 0.11) * 0.45;
  camera.position.y = Math.cos(t * 0.08) * 0.22;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
