<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nebula A/B Adjustable GUI</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #09111f 0%, #03060d 55%, #000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
    }
    .hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      color: rgba(255,255,255,0.82);
      font-size: 12px;
      line-height: 1.4;
      border-radius: 10px;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="hint">
  模式 A = 稳定云层 / 模式 B = 无后处理发光增强<br/>
  改“结构类参数”后点 <b>Rebuild</b>；其余可实时调
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm";

/* -------------------------------------------------------
   基础场景
------------------------------------------------------- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.018);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0, 0.2, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

/* -------------------------------------------------------
   参数
------------------------------------------------------- */
const params = {
  mode: "A",

  theme: "Dreamy",
  starCount: 2600,

  mainCount: 260,
  mistCount: 180,
  glowCount: 80,

  mainOpacity: 0.20,
  mistOpacity: 0.10,
  glowOpacity: 0.07,

  mainSizeMin: 3.0,
  mainSizeMax: 7.5,
  mistSizeMin: 5.0,
  mistSizeMax: 11.0,
  glowSizeMin: 2.6,
  glowSizeMax: 5.2,

  exposure: 1.2,
  glowBoost: 1.0,

  driftStrength: 0.08,
  driftSpeed: 0.18,

  rotationSpeed: 0.00045,
  tiltAmount: 0.10,

  fogDensity: 0.018,

  cameraDistance: 14.0,
  cameraFloatX: 0.45,
  cameraFloatY: 0.25,
  cameraFloatSpeedX: 0.10,
  cameraFloatSpeedY: 0.07,

  showStars: true,
  autoRotate: true,

  rebuild: () => rebuildAll(),
  resetToA: () => applyPreset("A"),
  resetToB: () => applyPreset("B")
};

/* -------------------------------------------------------
   颜色主题
------------------------------------------------------- */
const THEMES = {
  Dreamy: [
    {
      center: new THREE.Vector3(-2.3,  0.8,  0.0),
      radius: new THREE.Vector3(2.8, 1.2, 1.5),
      colors: ["#3db8ff", "#7a5cff", "#a26cff"]
    },
    {
      center: new THREE.Vector3( 1.8, -0.4, -0.3),
      radius: new THREE.Vector3(2.4, 1.0, 1.6),
      colors: ["#9a5cff", "#d65bff", "#ff5fa7"]
    },
    {
      center: new THREE.Vector3( 0.2,  1.4, -1.0),
      radius: new THREE.Vector3(2.0, 0.9, 1.3),
      colors: ["#62ddd0", "#6b8cff", "#8a63ff"]
    },
    {
      center: new THREE.Vector3(-0.2, -1.2,  1.0),
      radius: new THREE.Vector3(2.1, 0.9, 1.5),
      colors: ["#429cff", "#915dff", "#d94f92"]
    }
  ],
  NASAish: [
    {
      center: new THREE.Vector3(-2.2, 0.9, 0.0),
      radius: new THREE.Vector3(3.0, 1.3, 1.7),
      colors: ["#3fa7d6", "#5f6caf", "#7f5aa2"]
    },
    {
      center: new THREE.Vector3( 1.9, -0.2, -0.2),
      radius: new THREE.Vector3(2.6, 1.1, 1.7),
      colors: ["#7a68b3", "#aa6c8d", "#d07c54"]
    },
    {
      center: new THREE.Vector3( 0.0, 1.4, -0.9),
      radius: new THREE.Vector3(2.2, 0.9, 1.4),
      colors: ["#73c0c9", "#6275b7", "#8c6199"]
    },
    {
      center: new THREE.Vector3(-0.3, -1.3, 1.0),
      radius: new THREE.Vector3(2.1, 0.9, 1.5),
      colors: ["#4777b7", "#8068b7", "#b8708d"]
    }
  ],
  CyanMagenta: [
    {
      center: new THREE.Vector3(-2.3, 0.8, 0.0),
      radius: new THREE.Vector3(2.8, 1.2, 1.5),
      colors: ["#16dbff", "#4d7cff", "#7d5cff"]
    },
    {
      center: new THREE.Vector3(1.8, -0.4, -0.3),
      radius: new THREE.Vector3(2.4, 1.0, 1.6),
      colors: ["#8d4bff", "#cc4dff", "#ff4faa"]
    },
    {
      center: new THREE.Vector3(0.2, 1.3, -1.0),
      radius: new THREE.Vector3(2.0, 0.9, 1.3),
      colors: ["#52ffd9", "#36b8ff", "#8364ff"]
    },
    {
      center: new THREE.Vector3(-0.1, -1.1, 1.0),
      radius: new THREE.Vector3(2.1, 0.9, 1.5),
      colors: ["#3ca0ff", "#7c5fff", "#ff4f9f"]
    }
  ]
};

/* -------------------------------------------------------
   运行对象容器
------------------------------------------------------- */
let nebulaGroup = new THREE.Group();
scene.add(nebulaGroup);

let starsPoints = null;
let cloudSprites = [];
let createdMaterials = [];
let cloudTexture = null;

/* -------------------------------------------------------
   工具函数
------------------------------------------------------- */
function randn() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function pickColor(arr) {
  return new THREE.Color(arr[(Math.random() * arr.length) | 0]);
}

function disposeObject(obj) {
  if (!obj) return;
  if (obj.geometry) obj.geometry.dispose();
  if (obj.material) {
    if (Array.isArray(obj.material)) {
      obj.material.forEach(m => m.dispose && m.dispose());
    } else {
      obj.material.dispose && obj.material.dispose();
    }
  }
}

function clearGroup(group) {
  while (group.children.length) {
    const child = group.children.pop();
    disposeObject(child);
  }
}

function createCloudTexture(size = 256) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, size, size);

  const grad = ctx.createRadialGradient(
    size * 0.5, size * 0.5, size * 0.05,
    size * 0.5, size * 0.5, size * 0.5
  );

  grad.addColorStop(0.0, "rgba(255,255,255,1.0)");
  grad.addColorStop(0.18, "rgba(255,255,255,0.72)");
  grad.addColorStop(0.45, "rgba(255,255,255,0.28)");
  grad.addColorStop(1.0, "rgba(255,255,255,0.0)");

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // 打碎边缘的云块
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = size * (0.04 + Math.random() * 0.12);

    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.015 + Math.random() * 0.03;
    g.addColorStop(0, `rgba(255,255,255,${a})`);
    g.addColorStop(1, `rgba(255,255,255,0)`);

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

/* -------------------------------------------------------
   星空
------------------------------------------------------- */
function buildStars() {
  if (starsPoints) {
    scene.remove(starsPoints);
    disposeObject(starsPoints);
    starsPoints = null;
  }

  if (!params.showStars) return;

  const count = params.starCount;
  const geo = new THREE.BufferGeometry();

  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    const r = 35 + Math.random() * 30;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);

    positions[i3 + 0] = r * Math.sin(phi) * Math.cos(theta);
    positions[i3 + 1] = r * Math.cos(phi);
    positions[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const c = 0.82 + Math.random() * 0.18;
    colors[i3 + 0] = c;
    colors[i3 + 1] = c;
    colors[i3 + 2] = c;

    sizes[i] = 0.8 + Math.random() * 1.8;
  }

  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true,
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;

      void main() {
        vColor = color;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (110.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;

      void main() {
        vec2 p = gl_PointCoord - 0.5;
        float d = length(p);
        float a = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor, a * 0.82);
      }
    `
  });

  starsPoints = new THREE.Points(geo, mat);
  scene.add(starsPoints);
}

/* -------------------------------------------------------
   星云
------------------------------------------------------- */
function makeSpriteMaterial({ color, opacity, blending }) {
  const mat = new THREE.SpriteMaterial({
    map: cloudTexture,
    transparent: true,
    depthWrite: false,
    blending,
    opacity,
    color
  });
  createdMaterials.push(mat);
  return mat;
}

function addCloudLayer({
  blobs,
  count,
  sizeMin,
  sizeMax,
  alphaMin,
  alphaMax,
  blending,
  colorBoost = 1.0,
  scaleZ = 1.0
}) {
  for (let i = 0; i < count; i++) {
    const blob = blobs[(Math.random() * blobs.length) | 0];

    const color = pickColor(blob.colors).multiplyScalar(colorBoost);
    const opacity = alphaMin + Math.random() * (alphaMax - alphaMin);

    const material = makeSpriteMaterial({
      color,
      opacity,
      blending
    });

    const sprite = new THREE.Sprite(material);

    sprite.position.set(
      blob.center.x + randn() * blob.radius.x,
      blob.center.y + randn() * blob.radius.y,
      blob.center.z + randn() * blob.radius.z * scaleZ
    );

    const s = sizeMin + Math.random() * (sizeMax - sizeMin);
    sprite.scale.set(
      s,
      s * (0.75 + Math.random() * 0.5),
      1
    );

    sprite.userData = {
      baseX: sprite.position.x,
      baseY: sprite.position.y,
      baseZ: sprite.position.z,
      baseScaleX: sprite.scale.x,
      baseScaleY: sprite.scale.y,
      seed: Math.random() * 1000,
      layerBlend: blending
    };

    nebulaGroup.add(sprite);
    cloudSprites.push(sprite);
  }
}

function buildNebula() {
  clearGroup(nebulaGroup);
  cloudSprites = [];
  createdMaterials.forEach(m => m.dispose());
  createdMaterials = [];

  if (!cloudTexture) {
    cloudTexture = createCloudTexture(256);
  }

  const blobs = THEMES[params.theme];

  // 模式相关参数
  const isB = params.mode === "B";

  // A：稳妥可见
  // B：更亮一点 + glow 稍强些（无后处理）
  const mainBoost = isB ? 1.18 * params.glowBoost : 1.0;
  const mistBoost = isB ? 1.00 * params.glowBoost : 0.92;
  const glowBoost = isB ? 1.15 * params.glowBoost : 1.0;

  // 主体层
  addCloudLayer({
    blobs,
    count: params.mainCount,
    sizeMin: params.mainSizeMin,
    sizeMax: params.mainSizeMax,
    alphaMin: Math.max(0.01, params.mainOpacity * 0.65),
    alphaMax: params.mainOpacity,
    blending: THREE.NormalBlending,
    colorBoost: mainBoost,
    scaleZ: 1.0
  });

  // 薄雾层
  addCloudLayer({
    blobs,
    count: params.mistCount,
    sizeMin: params.mistSizeMin,
    sizeMax: params.mistSizeMax,
    alphaMin: Math.max(0.01, params.mistOpacity * 0.55),
    alphaMax: params.mistOpacity,
    blending: THREE.NormalBlending,
    colorBoost: mistBoost,
    scaleZ: 1.25
  });

  // 发光层（B 模式明显一点，A 模式保守一点）
  if (params.glowCount > 0) {
    addCloudLayer({
      blobs,
      count: params.glowCount,
      sizeMin: params.glowSizeMin,
      sizeMax: params.glowSizeMax,
      alphaMin: Math.max(0.01, params.glowOpacity * 0.55),
      alphaMax: params.glowOpacity,
      blending: THREE.AdditiveBlending,
      colorBoost: glowBoost,
      scaleZ: 0.85
    });
  }
}

/* -------------------------------------------------------
   Build / Rebuild
------------------------------------------------------- */
function rebuildAll() {
  renderer.toneMappingExposure = params.exposure;
  scene.fog.density = params.fogDensity;
  camera.position.z = params.cameraDistance;

  buildStars();
  buildNebula();
}

/* -------------------------------------------------------
   A / B 预设
------------------------------------------------------- */
function applyPreset(mode) {
  params.mode = mode;

  if (mode === "A") {
    params.theme = "Dreamy";

    params.mainCount = 260;
    params.mistCount = 180;
    params.glowCount = 50;

    params.mainOpacity = 0.20;
    params.mistOpacity = 0.10;
    params.glowOpacity = 0.05;

    params.mainSizeMin = 3.0;
    params.mainSizeMax = 7.5;
    params.mistSizeMin = 5.0;
    params.mistSizeMax = 11.0;
    params.glowSizeMin = 2.4;
    params.glowSizeMax = 4.8;

    params.exposure = 1.2;
    params.glowBoost = 1.0;
    params.fogDensity = 0.018;
  } else {
    params.theme = "CyanMagenta";

    params.mainCount = 300;
    params.mistCount = 190;
    params.glowCount = 95;

    params.mainOpacity = 0.23;
    params.mistOpacity = 0.12;
    params.glowOpacity = 0.08;

    params.mainSizeMin = 3.0;
    params.mainSizeMax = 8.2;
    params.mistSizeMin = 5.5;
    params.mistSizeMax = 12.0;
    params.glowSizeMin = 2.6;
    params.glowSizeMax = 5.5;

    params.exposure = 1.35;
    params.glowBoost = 1.08;
    params.fogDensity = 0.016;
  }

  syncGui();
  rebuildAll();
}

/* -------------------------------------------------------
   GUI
------------------------------------------------------- */
const gui = new GUI({ title: "Nebula Controls", width: 340 });

const controllers = [];

function addController(folder, object, prop, ...args) {
  const c = folder.add(object, prop, ...args);
  controllers.push(c);
  return c;
}

const fMode = gui.addFolder("模式 / Presets");
addController(fMode, params, "mode", ["A", "B"]).name("Mode").onChange((v) => {
  if (v === "A") applyPreset("A");
  else applyPreset("B");
});
addController(fMode, params, "resetToA").name("Apply Preset A");
addController(fMode, params, "resetToB").name("Apply Preset B");
fMode.open();

const fTheme = gui.addFolder("颜色 / Theme");
addController(fTheme, params, "theme", Object.keys(THEMES)).name("Theme").onChange(rebuildAll);

const fStructure = gui.addFolder("结构 / Structure");
addController(fStructure, params, "starCount", 0, 6000, 100).name("Stars");
addController(fStructure, params, "mainCount", 50, 600, 10).name("Main Clouds");
addController(fStructure, params, "mistCount", 0, 500, 10).name("Mist Clouds");
addController(fStructure, params, "glowCount", 0, 250, 5).name("Glow Clouds");
addController(fStructure, params, "showStars").name("Show Stars").onChange(rebuildAll);

const fOpacity = gui.addFolder("透明度 / Opacity");
addController(fOpacity, params, "mainOpacity", 0.05, 0.40, 0.01).name("Main Opacity").onChange(rebuildAll);
addController(fOpacity, params, "mistOpacity", 0.02, 0.25, 0.01).name("Mist Opacity").onChange(rebuildAll);
addController(fOpacity, params, "glowOpacity", 0.00, 0.18, 0.005).name("Glow Opacity").onChange(rebuildAll);

const fSize = gui.addFolder("尺寸 / Size");
addController(fSize, params, "mainSizeMin", 1.0, 8.0, 0.1).name("Main Size Min");
addController(fSize, params, "mainSizeMax", 2.0, 16.0, 0.1).name("Main Size Max");
addController(fSize, params, "mistSizeMin", 2.0, 10.0, 0.1).name("Mist Size Min");
addController(fSize, params, "mistSizeMax", 4.0, 20.0, 0.1).name("Mist Size Max");
addController(fSize, params, "glowSizeMin", 1.0, 8.0, 0.1).name("Glow Size Min");
addController(fSize, params, "glowSizeMax", 2.0, 12.0, 0.1).name("Glow Size Max");

const fLook = gui.addFolder("观感 / Look");
addController(fLook, params, "exposure", 0.6, 2.4, 0.01).name("Exposure").onChange(v => {
  renderer.toneMappingExposure = v;
});
addController(fLook, params, "glowBoost", 0.60, 1.60, 0.01).name("Glow Boost").onChange(rebuildAll);
addController(fLook, params, "fogDensity", 0.000, 0.05, 0.001).name("Fog Density").onChange(v => {
  scene.fog.density = v;
});

const fMotion = gui.addFolder("动态 / Motion");
addController(fMotion, params, "driftStrength", 0.00, 0.30, 0.005).name("Drift Strength");
addController(fMotion, params, "driftSpeed", 0.00, 0.60, 0.01).name("Drift Speed");
addController(fMotion, params, "rotationSpeed", 0.0000, 0.0020, 0.00001).name("Rotation Speed");
addController(fMotion, params, "tiltAmount", 0.0, 0.4, 0.01).name("Tilt Amount");
addController(fMotion, params, "autoRotate").name("Auto Rotate");

const fCamera = gui.addFolder("相机 / Camera");
addController(fCamera, params, "cameraDistance", 8.0, 22.0, 0.1).name("Distance").onChange(v => {
  camera.position.z = v;
});
addController(fCamera, params, "cameraFloatX", 0.0, 1.2, 0.01).name("Float X");
addController(fCamera, params, "cameraFloatY", 0.0, 0.8, 0.01).name("Float Y");
addController(fCamera, params, "cameraFloatSpeedX", 0.00, 0.40, 0.01).name("Float Speed X");
addController(fCamera, params, "cameraFloatSpeedY", 0.00, 0.40, 0.01).name("Float Speed Y");

gui.add(params, "rebuild").name("Rebuild");

/* GUI 同步 */
function syncGui() {
  controllers.forEach(c => c.updateDisplay());
}

/* -------------------------------------------------------
   初始化
------------------------------------------------------- */
applyPreset("A");

/* -------------------------------------------------------
   动画
------------------------------------------------------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  if (params.autoRotate) {
    nebulaGroup.rotation.z += params.rotationSpeed;
    nebulaGroup.rotation.y = Math.sin(t * 0.08) * params.tiltAmount;
  }

  const driftStrength = params.driftStrength;
  const driftSpeed = params.driftSpeed;

  for (const s of cloudSprites) {
    const d = s.userData;

    s.position.x = d.baseX + Math.sin(t * driftSpeed + d.seed) * driftStrength;
    s.position.y = d.baseY + Math.cos(t * (driftSpeed * 0.85) + d.seed * 1.3) * (driftStrength * 0.75);
    s.position.z = d.baseZ + Math.sin(t * (driftSpeed * 0.66) + d.seed * 0.7) * (driftStrength * 0.55);

    const pulse = 1.0 + Math.sin(t * 0.35 + d.seed * 2.0) * 0.04;
    s.scale.x = d.baseScaleX * pulse;
    s.scale.y = d.baseScaleY * pulse;
  }

  camera.position.x = Math.sin(t * params.cameraFloatSpeedX) * params.cameraFloatX;
  camera.position.y = Math.cos(t * params.cameraFloatSpeedY) * params.cameraFloatY;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

/* -------------------------------------------------------
   Resize
------------------------------------------------------- */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
